[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-vla-hil"
version = "0.1.0"
description = "Hardware-in-the-Loop testbed benchmarking latency-robust action chunking over edge networks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Henry Nguyen", email = "henrynguyen.vp@gmail.com" }
]
keywords = [
    "robotics",
    "ros2",
    "diffusion-policy",
    "hardware-in-the-loop",
    "action-chunking",
    "real-time-chunking",
    "edge-ai",
]

dependencies = [
    "numpy>=1.24,<2.0",
    "robosuite==1.4.1",
    "mujoco==2.3.7",
    "torch>=2.2.1,<2.8.0",
    "lerobot==0.3.3",
    "opencv-python>=4.8",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "pyyaml>=6.0",
    "imageio[ffmpeg]>=2.31",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-asyncio>=0.21.0",
]
lint = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
]
dev = [
    "edge-vla-hil[test,lint]",
    "pre-commit>=3.5.0",
    "ipdb>=0.13.0",
]
jetson = [
    "numpy>=1.24,<2.0",
    "opencv-python>=4.8",
    "pycuda>=2024.1",
    "onnx>=1.15",
]

# ----------------------------------------------------------------------
# Build & package discovery
# ----------------------------------------------------------------------

[tool.setuptools.packages.find]
where = [
    "ros2_ws/src/evh_plant",
    "ros2_ws/src/evh_controller",
    "ros2_ws/src/evh_reactive",
    "ros2_ws/src/evh_latency",
    "ros2_ws/src/evh_bringup",
]

# ----------------------------------------------------------------------
# Tooling configurations
# ----------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
markers = [
    "ros2: test requires a sourced ROS2 environment (rclpy + message packages)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "external",
    "ros2_ws/build",
    "ros2_ws/install",
    "ros2_ws/log",
    "outputs",
    "*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length handled by ruff format / docstrings
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip without strict=
]

[tool.ruff.lint.isort]
known-first-party = [
    "evh_plant",
    "evh_controller",
    "evh_reactive",
    "evh_latency",
    "evh_bringup",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "^external/",
    "^ros2_ws/build/",
    "^ros2_ws/install/",
    "^ros2_ws/log/",
]

[tool.coverage.run]
source = ["ros2_ws/src"]
omit = [
    "*/tests/*",
    "*/external/*",
    "*/ros2_ws/build/*",
    "*/ros2_ws/install/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
